<nav class="navbar">
  <a routerLink="/" class="logo">{{ 'APP.TITLE' | translate }}</a>
  <div class="links">
    <a routerLink="/faq">{{ 'APP.BROWSE_FAQS' | translate }}</a>
    <a routerLink="/search">{{ 'APP.AI_SEARCH' | translate }}</a>
    <a routerLink="/ask" *ngIf="isLoggedIn">{{ 'APP.ASK' | translate }}</a>
    <a routerLink="/profile" *ngIf="isLoggedIn">{{ 'APP.PROFILE' | translate }}</a>
    <a routerLink="/admin" *ngIf="isAdmin">{{ 'APP.ADMIN' | translate }}</a>
    <a routerLink="/settings">{{ 'APP.SETTINGS' | translate }}</a>
    <a routerLink="/login" *ngIf="!isLoggedIn">{{ 'APP.LOGIN' | translate }}</a>
    <a (click)="logout()" *ngIf="isLoggedIn" style="cursor:pointer;">{{ 'APP.LOGOUT' | translate }}</a>
    <!-- Language Selector Dropdown -->
    <select class="lang-selector" [(ngModel)]="selLang" (change)="changeLang(selLang)" aria-label="Language">
      <option value="en">EN</option>
      <option value="es">ES</option>
    </select>
  </div>
</nav>
